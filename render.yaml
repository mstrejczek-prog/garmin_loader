# Render.com: New > Blueprint > wskaż to repozytorium. SECRET_KEY zostanie wygenerowany automatycznie.
services:
  - type: web
    name: garmin-plan-loader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 120
    healthCheckPath: /zdrowie
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: KOD_DOSTEPU
        sync: false
      # connector dla Claude (MCP) - patrz README, „Claude w czacie”
      - key: MCP_TOKEN
        sync: false
      - key: GARMIN_TOKEN
        sync: false
      - key: USTAWIENIA
        sync: false
      # Dysk Google dla plików FIT (README, „Dysk Google”)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN
        sync: false
      # łącznik wagi Zepp -> Garmin + arkusz (README, „Waga Xiaomi”)
      - key: ZEPP_EMAIL
        sync: false
      - key: ZEPP_PASSWORD
        sync: false
      - key: WAGA_TOKEN
        sync: false
      - key: WAGA_MIN
        sync: false
      - key: WAGA_MAX
        sync: false
